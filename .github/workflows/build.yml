name: Windows x86 build and portable core tests
on:
  push:
  workflow_dispatch:
  pull_request:
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Configure x86
        run: cmake -S . -B build -A Win32 -DWHM_BUILD_TESTS=ON
      - name: Build Release
        run: cmake --build build --config Release --target WhatHurtsMost whm_tests --parallel
      - name: Test core
        run: ctest --test-dir build -C Release --output-on-failure
