[HUD]
; 640x480 game coordinates, adjustable if it overlaps your card HUD.
X=405
Y=160
Width=230
Height=215
; Companion UI language: CN / JP / EN (2x2 control pad, top of bottom strip).
Language=CN
; 1 = folded to a small "+" at the panel's top-right corner. User state,
; kept across battles; it still hides on non-battle scenes and lost focus.
Collapsed=0

[Damage]
; 1=show approximate direct-attack frames with ~; 0=only manually profiled moves
EnableExperimentalFrameProbe=1

; Published Wiki maximum damage is loaded independently from WikiMaxProfiles.txt.
; Values with runtime buffs/current HP are estimated and marked ~.
